name: Generate Story Audio & Video

on:
  workflow_dispatch:   # bấm nút "Run workflow" thủ công trong tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install gTTS moviepy pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Prepare images (crop combined sheet or unzip)
        run: |
          mkdir -p images
          if [ -f combined_sheet.png ] || [ -f combined_sheet.jpg ] || [ -f combined_sheet.jpeg ]; then
            echo "Phat hien anh gop -> dang cat thanh tung o..."
            python crop_grid.py
          elif [ -f batch_images.zip ]; then
            echo "Phat hien file zip -> dang giai nen..."
            rm -rf images_tmp
            unzip -o batch_images.zip -d images_tmp
            find images_tmp -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" \) -exec mv {} images/ \;
            rm -rf images_tmp
          else
            echo "Khong tim thay combined_sheet.png/jpg hoac batch_images.zip trong repo."
            exit 1
          fi

      - name: Generate audio (Chinese TTS)
        run: python generate_audio.py

      - name: Build story video
        run: python make_video.py

      - name: Upload audio files
        uses: actions/upload-artifact@v4
        with:
          name: audio
          path: audio/

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: story_video
          path: story_video.mp4
