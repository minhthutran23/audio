name: Generate Simple Narration Audio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install edge-tts moviepy
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate narration video (black background)
        run: python generate_simple_audio.py

      - name: Upload narration video
        uses: actions/upload-artifact@v4
        with:
          name: narration_video
          path: narration_video.mp4
